aid: jagex
name: Jagex
description: >-
  Jagex is a British video game developer and publisher headquartered in
  Cambridge, England, best known as the studio behind RuneScape and Old School
  RuneScape - persistent, community-shaped online worlds that have run for over
  two decades. Beyond the games, Jagex operates a set of public, read-only
  RuneScape web-data APIs: the Grand Exchange item price and catalogue
  endpoints (for both RuneScape and Old School RuneScape), the RuneScape and
  Old School RuneScape Hiscores, and the RuneMetrics player-profile service.
  These unauthenticated JSON and CSV endpoints power a large third-party
  ecosystem of price trackers, fan sites, clan tools, and community
  applications. Jagex was surfaced as a portfolio company of Insight Partners.

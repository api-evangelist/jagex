apis:
- name: RuneScape Grand Exchange API
  description: >-
    Read-only JSON endpoints for the RuneScape (RS3) Grand Exchange item
    database - item detail (price, trend, 30/90/180-day movement), category
    listings, and daily price-history graphs. Unauthenticated GET.
  humanURL: https://secure.runescape.com/m=itemdb_rs/
  baseURL: https://secure.runescape.com/m=itemdb_rs/api
  tags:
  - RuneScape
  - Grand Exchange
  - Prices
  - Game Data
  properties:
  - type: Documentation
    url: https://runescape.wiki/w/Application_programming_interface
- name: Old School RuneScape Grand Exchange API
  description: >-
    Read-only JSON endpoints for the Old School RuneScape (OSRS) Grand Exchange
    item database - item detail, category listings, and price-history graphs.
    Unauthenticated GET.
  humanURL: https://secure.runescape.com/m=itemdb_oldschool/
  baseURL: https://secure.runescape.com/m=itemdb_oldschool/api
  tags:
  - Old School RuneScape
  - Grand Exchange
  - Prices
  - Game Data
- name: RuneScape Hiscores API
  description: >-
    Player skill and activity rankings for RuneScape (RS3). The index_lite
    endpoint returns rank, level, and experience per skill as CSV;
    unauthenticated GET keyed by player display name.
  humanURL: https://secure.runescape.com/m=hiscore/
  baseURL: https://services.runescape.com/m=hiscore
  tags:
  - RuneScape
  - Hiscores
  - Player Data
- name: Old School RuneScape Hiscores API
  description: >-
    Player skill and activity rankings for Old School RuneScape (OSRS). The
    index_lite endpoint returns rank, level, and experience per skill as CSV;
    unauthenticated GET keyed by player display name.
  humanURL: https://secure.runescape.com/m=hiscore_oldschool/
  baseURL: https://secure.runescape.com/m=hiscore_oldschool
  tags:
  - Old School RuneScape
  - Hiscores
  - Player Data
- name: RuneMetrics Profile API
  description: >-
    Public player-profile service for RuneScape (RS3), exposing summary
    statistics, skill levels, quest progress, and recent activity for accounts
    that have opted their profile public. Returns JSON; unauthenticated GET
    keyed by player name.
  humanURL: https://apps.runescape.com/runemetrics/app/welcome
  baseURL: https://apps.runescape.com/runemetrics/profile
  tags:
  - RuneScape
  - Player Data
  - RuneMetrics
